name: Manual npm release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish @hardmachinelabs/index-ai-validator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test validator
        run: pnpm --filter @hardmachinelabs/index-ai-validator test

      - name: Check validator
        run: pnpm --filter @hardmachinelabs/index-ai-validator check

      - name: Build validator
        run: pnpm --filter @hardmachinelabs/index-ai-validator build

      - name: Check workspace
        run: pnpm check

      - name: Build workspace
        run: pnpm build

      - name: Verify npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is missing. Add it as a GitHub Actions secret before releasing."
            exit 1
          fi

      # Bump packages/validator/package.json before running this manual workflow.
      - name: Publish validator package
        working-directory: packages/validator
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --provenance

      # Everything below only runs after a real publish succeeded (steps stop
      # on failure by default) — tag/release always point at a version that
      # actually made it to the npm registry, never a failed attempt.
      - name: Read published version
        id: pkg
        working-directory: packages/validator
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.pkg.outputs.version }}" -m "v${{ steps.pkg.outputs.version }}"
          git push origin "v${{ steps.pkg.outputs.version }}"

      # Extracts the section for this version from the changeset-generated
      # CHANGELOG.md (format: "## <version>" heading, content until the next
      # "## " heading) so the GitHub Release body always matches what
      # `pnpm changeset version` already wrote — never duplicated by hand.
      - name: Extract changelog section
        id: changelog
        working-directory: packages/validator
        run: |
          NOTES=$(awk -v ver="## ${{ steps.pkg.outputs.version }}" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.pkg.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ steps.pkg.outputs.version }}" \
            --notes "${{ steps.changelog.outputs.notes }}"
