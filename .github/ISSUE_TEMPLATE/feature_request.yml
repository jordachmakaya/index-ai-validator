name: Feature request
description: Suggest a scoped improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What change do you suggest?
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Validator Level 1
        - Validator Level 2a
        - Documentation
        - CI/release tooling
        - Other
    validations:
      required: true
