name: Bug report
description: Report a reproducible validator or documentation bug.
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide steps, commands, and a minimal public example.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "20.x"
  - type: input
    id: pnpm
    attributes:
      label: pnpm version
      placeholder: "10.x"
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Do not include secrets, private URLs, or credentials.
